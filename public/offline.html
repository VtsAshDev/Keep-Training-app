<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sem conexão · Keep Focus</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <style>
        /* Static fallback served by the service worker; it cannot load the Vite build, so the
           Keep Focus tokens are repeated here. */
        :root { color-scheme: light dark; --bg: #faf8f6; --ink: #1a1412; --muted: #6b625c; --brand: #ff6a00; --on-brand: #1a0f08; --brand-text: #c04a00; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f0d0c; --ink: #f5f1ee; --muted: #a8a09b; --brand-text: #ffa463; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 28px; background: var(--bg); color: var(--ink); font-family: Barlow, system-ui, sans-serif; }
        .mark { width: 72px; height: 72px; border-radius: 18px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font: italic 700 40px/1 "Barlow Condensed", "Arial Narrow", sans-serif; }
        h1 { margin: 24px 0 0; font: 600 40px/1.05 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
        p { margin: 12px 0 0; max-width: 320px; font-size: 17px; line-height: 1.5; color: var(--muted); }
        button { margin-top: 28px; min-height: 52px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font: 600 17px system-ui, sans-serif; cursor: pointer; }
    </style>
</head>
<body>
    <div class="mark" aria-hidden="true">KF</div>
    <h1>Sem conexão</h1>
    <p>O Keep Focus precisa de internet para carregar seus treinos. Assim que a conexão voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
</body>
</html>
