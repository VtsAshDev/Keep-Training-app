name: pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/projects/Keep-Training-app
            git config --global --add safe.directory /opt/projects/Keep-Training-app
            git fetch --all
            git reset --hard origin/main
            docker run --rm -u "$(id -u):$(id -g)" -v "$(pwd):/app" -w /app composer:latest composer install --no-interaction --prefer-dist --optimize-autoloader
            # Backup of the SQLite database before every migration; keeps the last 10.
            mkdir -p database/backups
            if [ -f database/database.sqlite ]; then cp database/database.sqlite "database/backups/database-$(date +%Y%m%d-%H%M%S).sqlite"; fi
            ls -1t database/backups/*.sqlite 2>/dev/null | tail -n +11 | xargs -r rm --
            ./vendor/bin/sail artisan migrate --force
            ./vendor/bin/sail artisan optimize:clear
            ./vendor/bin/sail artisan optimize
            ./vendor/bin/sail artisan view:cache
            ./vendor/bin/sail artisan event:cache
            ./vendor/bin/sail npm install
            ./vendor/bin/sail npm run build
