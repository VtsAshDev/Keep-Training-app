<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar ficha</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:ital,wght@0,600;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:#FFA463}a:hover{color:#FFC79E}
</style>

</head>
<body style="background:#555;display:flex;justify-content:center;padding:24px">


<div style="width: 390px; height: 844px; background: #0F0D0C; color: #F5F1EE; font-family: Barlow, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="display: flex; align-items: center; gap: 8px; padding: 52px 12px 12px; border-bottom: 1px solid #332C29">
<a href="fichas.html" aria-label="Voltar para Fichas" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5F1EE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div class="d" style="flex: 1; font-size: 22px">FICHA B</div>
<button type="button" aria-label="Mais opções" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F5F1EE; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px; overflow: hidden">
<label style="display: block">
<span style="display: block; font-size: 13px; color: #A8A09B; margin-bottom: 6px">Nome da ficha</span>
<input type="text" value="Costas e bíceps" style="width: 100%; height: 48px; padding: 0 14px; font: inherit; font-size: 16px; color: #F5F1EE; background: #1A1716; border: 1px solid #332C29; border-radius: 12px">
</label>
<div style="font-size: 13px; color: #A8A09B; margin-top: 6px">Exercícios · 6</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 12px 0 4px; background: #1A1716; border: 1px solid #332C29; border-radius: 12px">
<span aria-hidden="true" style="width: 28px; display: flex; justify-content: center; color: #A8A09B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 500">Puxada frontal</span><span class="num" style="font-size: 13px; color: #A8A09B">3 × 8–12 · 90 s</span></span>
</div>
<section style="background: #1A1716; border: 1px solid #FF6A00; border-radius: 12px; padding: 12px 12px 14px 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-weight: 500">Remada curvada</span>
<button type="button" style="min-height: 36px; padding: 0 8px; border: 0; background: transparent; color: #A8A09B; font-size: 14px">Remover</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px">
<div>
<div style="font-size: 12px; color: #A8A09B; margin-bottom: 4px">Séries</div>
<div style="display: flex; align-items: center; height: 44px; border: 1px solid #332C29; border-radius: 10px; background: #0F0D0C">
<button type="button" aria-label="Menos uma série" style="width: 44px; height: 42px; border: 0; background: transparent; color: #F5F1EE; font-size: 20px">−</button>
<span class="d num" style="flex: 1; text-align: center; font-size: 20px">3</span>
<button type="button" aria-label="Mais uma série" style="width: 44px; height: 42px; border: 0; background: transparent; color: #F5F1EE; font-size: 20px">+</button>
</div>
</div>
<div>
<div style="font-size: 12px; color: #A8A09B; margin-bottom: 4px">Descanso</div>
<div style="display: flex; align-items: center; height: 44px; border: 1px solid #332C29; border-radius: 10px; background: #0F0D0C">
<button type="button" aria-label="Menos 15 segundos" style="width: 44px; height: 42px; border: 0; background: transparent; color: #F5F1EE; font-size: 20px">−</button>
<span class="d num" style="flex: 1; text-align: center; font-size: 20px">90 s</span>
<button type="button" aria-label="Mais 15 segundos" style="width: 44px; height: 42px; border: 0; background: transparent; color: #F5F1EE; font-size: 20px">+</button>
</div>
</div>
</div>
<div style="font-size: 12px; color: #A8A09B; margin: 10px 0 4px">Faixa de repetições</div>
<div style="display: flex; align-items: center; gap: 8px">
<label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Repetições mínimas</span><input type="text" inputmode="numeric" value="8" class="d num" style="width: 100%; height: 44px; text-align: center; font-size: 20px; color: #F5F1EE; background: #0F0D0C; border: 1px solid #332C29; border-radius: 10px"></label>
<span style="color: #A8A09B">até</span>
<label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Repetições máximas</span><input type="text" inputmode="numeric" value="12" class="d num" style="width: 100%; height: 44px; text-align: center; font-size: 20px; color: #F5F1EE; background: #0F0D0C; border: 1px solid #332C29; border-radius: 10px"></label>
</div>
</section>
<div style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 12px 0 4px; background: #1A1716; border: 1px solid #332C29; border-radius: 12px">
<span aria-hidden="true" style="width: 28px; display: flex; justify-content: center; color: #A8A09B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 500">Rosca direta</span><span class="num" style="font-size: 13px; color: #A8A09B">3 × 10–12 · 60 s</span></span>
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 12px 0 4px; background: #1A1716; border: 1px solid #332C29; border-radius: 12px">
<span aria-hidden="true" style="width: 28px; display: flex; justify-content: center; color: #A8A09B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 500">Rosca martelo</span><span class="num" style="font-size: 13px; color: #A8A09B">3 × 10–12 · 60 s</span></span>
</div>
</main>
<div style="display: flex; gap: 8px; padding: 12px 16px 34px; border-top: 1px solid #332C29">
<button type="button" style="flex: 1; min-height: 52px; background: transparent; color: #F5F1EE; border: 1px solid #332C29; border-radius: 12px; font-weight: 500">Adicionar exercício</button>
<a href="fichas.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; background: #FF6A00; color: #1A0F08; border-radius: 12px; font-weight: 600; text-decoration: none">Salvar</a>
</div>
</div>


</body>
</html>
