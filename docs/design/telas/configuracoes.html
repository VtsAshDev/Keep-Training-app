<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:ital,wght@0,600;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:#FFA463}a:hover{color:#FFC79E}
</style>

</head>
<body style="background:#555;display:flex;justify-content:center;padding:24px">


<div style="width: 390px; height: 844px; background: #0F0D0C; color: #F5F1EE; font-family: Barlow, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 56px 20px 0">
<h1 class="d" style="font-size: 34px; margin: 0">AJUSTES</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 20px; overflow: hidden">
<section style="background: #1A1716; border: 1px solid #332C29; border-radius: 16px; padding: 18px">
<div style="font-weight: 500">Meta semanal de treinos</div>
<div style="font-size: 14px; color: #A8A09B; margin-top: 2px; line-height: 1.5">Semana de segunda a domingo. A sequência conta as semanas em que você bate a meta.</div>
<div style="display: flex; align-items: center; height: 56px; margin-top: 14px; border: 1px solid #332C29; border-radius: 12px; background: #0F0D0C">
<button type="button" aria-label="Diminuir meta" style="width: 56px; height: 54px; border: 0; background: transparent; color: #F5F1EE; font-size: 24px">−</button>
<span style="flex: 1; text-align: center"><span class="d num" style="font-size: 30px">4</span><span style="font-size: 14px; color: #A8A09B"> treinos por semana</span></span>
<button type="button" aria-label="Aumentar meta" style="width: 56px; height: 54px; border: 0; background: transparent; color: #F5F1EE; font-size: 24px">+</button>
</div>
</section>
<section style="background: #1A1716; border: 1px solid #332C29; border-radius: 16px; padding: 18px">
<div style="font-size: 13px; color: #A8A09B">Conta</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 10px">
<span class="d" style="width: 48px; height: 48px; border-radius: 50%; background: #3A2312; color: #FFC79E; display: flex; align-items: center; justify-content: center; font-size: 22px">V</span>
<span style="flex: 1"><span style="display: block; font-weight: 500">Vitor</span><span style="font-size: 13px; color: #A8A09B">[seu e-mail do Google]</span></span>
</div>
<div style="font-size: 13px; color: #A8A09B; margin-top: 12px">Conectado com Google</div>
</section>
<section style="background: #1A1716; border: 1px solid #332C29; border-radius: 16px; padding: 4px 18px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #332C29"><span>Aparência</span><span style="font-size: 14px; color: #A8A09B">Segue o sistema</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px"><span>Unidade de carga</span><span style="font-size: 14px; color: #A8A09B">kg</span></div>
</section>
<a href="entrada.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 4px; border: 1px solid #332C29; border-radius: 12px; color: #F5F1EE; font-weight: 500; text-decoration: none">Sair da conta</a>
<div style="text-align: center; font-size: 12px; color: #A8A09B">Keep Focus · versão [x.y.z]</div>
</main>
<nav aria-label="Navegação principal" style="display: flex; border-top: 1px solid #332C29; background: #1A1716; padding: 6px 8px 26px">

<a href="fichas.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: #A8A09B; text-decoration: none; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Treino</a>
<a href="configuracoes.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: #FF6A00; text-decoration: none; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>Ajustes</a>
</nav>
</div>
